; MorphoNav ESP32 firmware — micro-ROS bridge for MPU9250 IMU + u-blox NEO-7M GPS.
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor -b 115200
;
; On the ROS 2 host (Humble):
;   ros2 run micro_ros_agent micro_ros_agent serial --dev /dev/ttyUSB0 -b 115200

[platformio]
default_envs = udp

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

board_microros_distro = humble
board_microros_transport = serial

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    mikalhart/TinyGPSPlus@^1.0.3

build_src_filter = +<*> -<imu_test.cpp> -<main_udp.cpp>

build_flags =
    -I include
    -D CONFIG_FREERTOS_HZ=1000

; Standalone IMU hardware test — no micro-ROS, raw Serial output.
; Use to verify MPU9250 + AK8963 are responding on the I2C bus.
;   pio run -e imu_test -t upload
;   pio device monitor -e imu_test
[env:imu_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_src_filter = -<*> +<imu_test.cpp>

build_flags =
    -I include

; UDP/JSON IMU streamer — WiFi transport instead of micro-ROS serial.
; Copy include/wifi_config.example.h to include/wifi_config.h and edit creds.
;   pio run -e udp -t upload
[env:udp]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    arduino-libraries/Madgwick@^1.2.0

build_src_filter = -<*> +<main_udp.cpp> +<mpu9250.cpp>

build_flags =
    -I include
    -D CONFIG_FREERTOS_HZ=1000
    -D CORE_DEBUG_LEVEL=0
