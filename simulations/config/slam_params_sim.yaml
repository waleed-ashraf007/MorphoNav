slam_toolbox:
  ros__parameters:
    odom_frame:  odom
    map_frame:   map
    base_frame:  base_footprint      # must match robot_base_frame in diff_drive plugin
    scan_topic:  /scan               # use raw lidar — filter was broken (wrong ROS2 format)
    use_sim_time: true               # CRITICAL: must be true for Gazebo

    mode: mapping
    map_update_interval: 0.5

    minimum_travel_distance: 0.0    # update on every scan
    minimum_travel_heading: 0.0

    max_laser_range: 12.0
    min_laser_range: 0.20

    transform_timeout: 1.0          # increased from 0.5 — gives TF lookups more time
    tf_buffer_duration: 30.0

    scan_buffer_size: 30
    use_scan_matching: true
    solver_plugin: solver_plugins::CeresSolver
